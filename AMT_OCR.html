<!DOCTYPE html>
<html lang="pl" xmlns:mso="urn:schemas-microsoft-com:office:office" xmlns:msdt="uuid:C2F41010-65B3-11d1-A29F-00AA00C14882">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OCR — Wyciąg tekstu</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✂️</text></svg>">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f4f0; --surface: #ffffff; --border: #d8d5ce;
    --text: #1a1917; --text-muted: #706e69; --accent: #1a56db;
    --accent-light: #e8f0fe; --success: #166534; --success-bg: #dcfce7;
    --error: #991b1b; --error-bg: #fee2e2;
    --mono: 'IBM Plex Mono', monospace; --sans: 'IBM Plex Sans', sans-serif;
  }
  body { font-family: var(--sans); background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 24px; }
  header { text-align: center; margin-bottom: 32px; }
  header h1 { font-size: 12px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; }
  header p { font-size: 26px; font-weight: 300; color: var(--text); }
  #nav-dashboard:hover { text-decoration: underline; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; width: 100%; max-width: 680px; }
  #drop-zone { padding: 40px 32px; text-align: center; cursor: pointer; border-bottom: 1px solid var(--border); transition: background 0.1s; }
  #drop-zone:hover, #drop-zone.drag-over { background: var(--accent-light); }
  #drop-zone .icon { font-size: 28px; margin-bottom: 12px; display: block; color: var(--text-muted); }
  #drop-zone .main-label { font-size: 15px; color: var(--text); margin-bottom: 4px; }
  #drop-zone .sub-label { font-size: 12px; color: var(--text-muted); font-family: var(--mono); }
  #drop-zone img#preview { display: none; max-width: 100%; max-height: 220px; object-fit: contain; border-radius: 2px; margin-top: 16px; border: 1px solid var(--border); }
  input[type=file] { display: none; }
  .tryb-bar { padding: 12px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .tryb-bar label { font-size: 12px; color: var(--text-muted); font-family: var(--mono); white-space: nowrap; }
  .tryb-bar select { font-family: var(--mono); font-size: 12px; padding: 5px 10px; border: 1px solid var(--border); border-radius: 2px; background: var(--bg); color: var(--text); flex: 1; min-width: 200px; }
  #status-bar { padding: 10px 20px; font-size: 12px; font-family: var(--mono); color: var(--text-muted); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; min-height: 38px; }
  #status-bar.ok { color: var(--success); background: var(--success-bg); }
  #status-bar.err { color: var(--error); background: var(--error-bg); }
  .spinner { width: 13px; height: 13px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; flex-shrink: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .result-section { padding: 16px 20px; }
  #result-box { width: 100%; min-height: 140px; padding: 12px 14px; font-family: var(--mono); font-size: 13px; line-height: 1.7; border: 1px solid var(--border); border-radius: 2px; background: var(--bg); color: var(--text); resize: vertical; outline: none; transition: border-color 0.15s; }
  #result-box:focus { border-color: var(--accent); }
  .actions { display: flex; gap: 8px; margin-top: 10px; justify-content: flex-end; }
  button { font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; padding: 7px 16px; border-radius: 2px; cursor: pointer; transition: all 0.1s; }
  #copy-btn { background: var(--accent); color: #fff; border: 1px solid var(--accent); }
  #copy-btn:hover { opacity: 0.88; }
  #clear-btn { background: transparent; color: var(--text-muted); border: 1px solid var(--border); }
  #clear-btn:hover { background: var(--bg); color: var(--text); }
  .history { padding: 12px 20px; border-top: 1px solid var(--border); }
  .history h3 { font-size: 11px; font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); margin-bottom: 8px; }
  .history-item { padding: 8px 10px; background: var(--bg); border-radius: 2px; font-family: var(--mono); font-size: 12px; color: var(--text); margin-bottom: 6px; cursor: pointer; border: 1px solid transparent; white-space: pre-wrap; max-height: 60px; overflow: hidden; text-overflow: ellipsis; }
  .history-item:hover { border-color: var(--accent); }
  .history-item .hist-meta { font-size: 10px; color: var(--text-muted); margin-bottom: 3px; }
  footer { margin-top: 24px; font-size: 11px; color: var(--text-muted); font-family: var(--mono); text-align: center; }
</style>

</head>
<body>

<header>
  <h1><a id="nav-dashboard" href="AMT_Dashboard.html" title="Powrót do Dashboardu" style="color:inherit;text-decoration:none;">AMT Systems</a></h1>
  <p>Wyciąganie tekstu z obrazków</p>
</header>

<div class="card">
  <div id="drop-zone" onclick="document.getElementById('file-input').click()">
    <span class="icon">📄</span>
    <p class="main-label">Wklej obrazek (Ctrl+V), przeciągnij lub kliknij</p>
    <p class="sub-label">PNG · JPG · GIF · WebP · BMP</p>
    <img id="preview" alt="podgląd">
  </div>
  <input type="file" id="file-input" accept="image/*">

  <div class="tryb-bar">
    <label>Tryb:</label>
    <select id="tryb-select">
      <option value="pelny">📄 Cały tekst — przepisz dokładnie</option>
      <option value="adres">📍 Adres — ulica, kod, miejscowość</option>
      <option value="numer">🔢 Numer pisma / znak sprawy</option>
      <option value="data">📅 Data dokumentu</option>
      <option value="nadawca">🏢 Nadawca / instytucja</option>
      <option value="ai">🤖 AI — wyciągnij kluczowe info</option>
    </select>
  </div>

  <div id="status-bar">
    <span id="status-text">Czekam na obrazek...</span>
  </div>

  <div class="result-section">
    <textarea id="result-box" placeholder="Rozpoznany tekst pojawi się tutaj...&#10;&#10;Możesz edytować tekst po rozpoznaniu."></textarea>
    <div class="actions">
      <button id="clear-btn" onclick="clearAll()">Wyczyść</button>
      <button id="copy-btn" onclick="copyText()">Kopiuj tekst</button>
    </div>
  </div>

  <div class="history" id="history-section" style="display:none;">
    <h3>Historia (kliknij żeby przywrócić)</h3>
    <div id="history-list"></div>
  </div>
</div>

<footer>Ctrl+V — wklej ze schowka &nbsp;|&nbsp; Kliknij historię żeby przywrócić wynik</footer>

<script>
const PROXY = 'https://amt-claude-proxy-gzg9bbg7gffja6gc.polandcentral-01.azurewebsites.net/api/claudeProxy';
const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');
const preview = document.getElementById('preview');
const resultBox = document.getElementById('result-box');
const statusBar = document.getElementById('status-bar');
const statusText = document.getElementById('status-text');

const promptMap = {
  'pelny':   'Przepisz DOKŁADNIE cały tekst widoczny na tym obrazku. Zwróć TYLKO sam tekst, bez żadnych komentarzy, bez opisu obrazu, bez cudzysłowów. Zachowaj oryginalne łamanie linii i układ.',
  'adres':   'Wyciągnij z tego obrazka tylko adres (ulica, numer, kod pocztowy, miejscowość). Zwróć TYLKO adres, nic więcej.',
  'numer':   'Wyciągnij z tego obrazka numer pisma, numer sprawy lub znak sprawy. Zwróć TYLKO ten numer/znak, nic więcej.',
  'data':    'Wyciągnij z tego obrazka datę pisma lub dokumentu. Zwróć TYLKO datę w formacie DD.MM.RRRR, nic więcej.',
  'nadawca': 'Wyciągnij z tego obrazka nazwę nadawcy lub instytucji. Zwróć TYLKO nazwę, nic więcej.',
  'ai':      'Przeanalizuj ten dokument i wyciągnij najważniejsze informacje: nadawca, data, numer pisma, treść w skrócie. Odpowiedz po polsku, zwięźle.'
};

const trybLabels = {
  'pelny': 'Cały tekst', 'adres': 'Adres', 'numer': 'Numer pisma',
  'data': 'Data', 'nadawca': 'Nadawca', 'ai': 'AI — kluczowe info'
};

let history = [];

function setStatus(msg, type) {
  statusBar.className = type || '';
  if (type === 'loading') {
    statusBar.innerHTML = '<div class="spinner"></div><span>' + msg + '</span>';
  } else {
    statusBar.innerHTML = '<span>' + msg + '</span>';
  }
}

// Klucz API Anthropic NIE jest już przechowywany ani używany w przeglądarce.
// Wywołania idą przez amt-claude-proxy (Azure) — klucz zarządzany po stronie serwera.

async function processImage(file) {
  if (!file || !file.type.startsWith('image/')) {
    setStatus('❌ To nie jest plik obrazu.', 'err');
    return;
  }

  const reader = new FileReader();
  reader.onload = async (e) => {
    const base64 = e.target.result.split(',')[1];
    const mediaType = file.type;
    const tryb = document.getElementById('tryb-select').value;

    preview.src = e.target.result;
    preview.style.display = 'block';
    resultBox.value = '';
    setStatus('Rozpoznaję tekst...', 'loading');

    try {
      const resp = await fetch(PROXY, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message: promptMap[tryb] || promptMap['pelny'],
          fileBase64: base64,
          fileMediaType: mediaType
        })
      });

      const data = await resp.json();
      if (!resp.ok) {
        throw new Error(data.error || data.message || ('HTTP ' + resp.status));
      }

      // Proxy może zwracać wynik pod różnymi kluczami zależnie od wersji — sprawdzamy po kolei.
      let txt = data.reply || data.message || data.text
        || (data.content && data.content[0] && data.content[0].text)
        || null;

      if (!txt) {
        throw new Error('Nierozpoznany format odpowiedzi proxy: ' + JSON.stringify(data).slice(0, 200));
      }

      resultBox.value = txt;
      setStatus('✓ Gotowe — ' + trybLabels[tryb], 'ok');
      addHistory(txt, trybLabels[tryb]);
    } catch (err) {
      setStatus('❌ Błąd połączenia: ' + err.message, 'err');
    }
  };
  reader.readAsDataURL(file);
}

function addHistory(text, label) {
  const now = new Date().toLocaleTimeString('pl-PL', {hour:'2-digit', minute:'2-digit'});
  history.unshift({ text, label, time: now });
  if (history.length > 5) history.pop();
  renderHistory();
}

function renderHistory() {
  const sec = document.getElementById('history-section');
  const list = document.getElementById('history-list');
  if (history.length === 0) { sec.style.display = 'none'; return; }
  sec.style.display = 'block';
  list.innerHTML = history.map((h, i) => `
    <div class="history-item" onclick="restoreHistory(${i})">
      <div class="hist-meta">${h.time} — ${h.label}</div>
      ${h.text.substring(0, 120)}${h.text.length > 120 ? '...' : ''}
    </div>
  `).join('');
}

function restoreHistory(i) {
  resultBox.value = history[i].text;
  setStatus('✓ Przywrócono z historii — ' + history[i].label, 'ok');
}

fileInput.addEventListener('change', () => { if (fileInput.files[0]) processImage(fileInput.files[0]); });

dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', (e) => {
  e.preventDefault(); dropZone.classList.remove('drag-over');
  if (e.dataTransfer.files[0]) processImage(e.dataTransfer.files[0]);
});

document.addEventListener('paste', (e) => {
  const items = e.clipboardData?.items;
  if (!items) return;
  for (const item of items) {
    if (item.type.startsWith('image/')) { processImage(item.getAsFile()); return; }
  }
});

function copyText() {
  if (!resultBox.value.trim()) return;
  navigator.clipboard.writeText(resultBox.value).then(() => {
    const btn = document.getElementById('copy-btn');
    btn.textContent = '✓ Skopiowano!';
    setTimeout(() => { btn.textContent = 'Kopiuj tekst'; }, 2000);
  });
}

function clearAll() {
  resultBox.value = ''; preview.style.display = 'none';
  preview.src = ''; fileInput.value = '';
  setStatus('Czekam na obrazek...'); statusBar.className = '';
}

// Link "AMT Systems" w nagłówku -> powrót do Dashboardu (spójny z logiką w AMT_Dashboard.html)
(function () {
  var link = document.getElementById('nav-dashboard');
  if (link && location.hostname === 'localhost') {
    link.href = 'http://localhost:8765/AMT_Dashboard.html';
  }
})();
</script>
</body>
</html>
